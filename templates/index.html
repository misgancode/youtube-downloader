<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Downloader</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui;background:#0b1020;color:#fff;padding:24px}.app{max-width:760px;margin:40px auto}.hero{text-align:center}.logo{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:18px;background:#ff1744;font-size:28px}h1{font-size:44px;margin:12px 0 8px}.sub{color:#9da8c0}.card{margin-top:24px;background:#151c31;border:1px solid #29334d;border-radius:22px;padding:24px}.row{display:flex;gap:10px}input,select,button{font:inherit;padding:14px;border-radius:11px}input,select{width:100%;background:#0d1427;color:#fff;border:1px solid #303a55}button{border:0;background:#6575ff;color:#fff;font-weight:700;cursor:pointer}.row input{flex:1}.row button{width:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.status{margin-top:18px;padding:14px;background:#0d1427;border-radius:11px;white-space:pre-wrap}.note{color:#909bb4;font-size:13px;line-height:1.6;margin-top:18px}@media(max-width:600px){.row{flex-direction:column}.row button{width:100%}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="hero"><div class="logo">▶</div><h1>Video Downloader</h1><div class="sub">Cloud-ready Flask frontend with server-side processing.</div></div><div class="card"><label>Video URL</label><div class="row"><input id="url" placeholder="https://www.youtube.com/watch?v=..."><button id="download">Download</button></div><div class="grid"><div><label>Quality</label><select id="quality"><option value="best">Best available</option><option value="720">Up to 720p</option><option value="480">Up to 480p</option><option value="audio">MP3 audio</option></select></div><div><label>Server</label><input id="health" value="Checking…" disabled></div></div><div id="status" class="status">Ready.</div><div class="note">Use only for content you are authorized to download and in accordance with the source site's terms. Cloud providers may impose resource and bandwidth limits.</div></div></div><script>
const s=document.getElementById("status");fetch("/health").then(r=>r.json()).then(x=>document.getElementById("health").value=x.yt_dlp&&x.ffmpeg?"Ready":"Missing dependency").catch(()=>document.getElementById("health").value="Unknown");
document.getElementById("download").onclick=async()=>{let url=document.getElementById("url").value.trim(),quality=document.getElementById("quality").value;if(!url){s.textContent="Please enter a URL.";return}s.textContent="Downloading…";try{let r=await fetch("/api/download",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,quality})});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||"Download failed")}let b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="video-download";a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);s.textContent="Download started."}catch(e){s.textContent="❌ "+e.message}};
</script></body></html>
